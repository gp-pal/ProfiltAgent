upstream laravel_app {
    server php_orchestrator:9000;
}

upstream browser_runner {
    server browser_runner:8080;
}

server {
    listen 80;
    server_name localhost;
    root /app/public;
    index index.php index.html index.htm;

    # Laravel application (main orchestrator)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        fastcgi_pass laravel_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout settings for long-running LLM operations
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # Browser runner API
    location /runner/ {
        proxy_pass http://browser_runner/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for browser operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoints
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static files and assets. Fall through to Laravel for paths that only look
    # like assets but are served dynamically (e.g. Livewire's livewire.min.js),
    # otherwise the regex swallows them and returns 404, which breaks the
    # Filament login form (no Livewire means the form never submits).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri /index.php?$query_string;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API endpoints are handled by the main Laravel application through FastCGI
}
